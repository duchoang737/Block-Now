<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shape Sort Jam — M0 greybox</title>
    <style>
      :root {
        color-scheme: dark;
        /* safe-area cho tai thỏ / thanh home — renderer đọc lại 4 biến này */
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; overflow: hidden; background: #2b2440;
        font-family: system-ui, sans-serif;
        height: 100vh; height: 100dvh;      /* dvh: trừ đúng thanh URL trên mobile */
        overscroll-behavior: none;          /* chặn kéo-để-tải-lại */
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex; flex-direction: column;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        touch-action: manipulation;         /* bỏ delay 300ms + zoom double-tap */
      }
      /* KHÔNG có thanh HTML nào phía trên board.
         Chọn màn nằm trong khay Cài đặt của chính game (nút bánh răng), nên trang
         chỉ còn đúng một thứ: canvas ăn trọn màn hình. Đây là game điện thoại —
         mọi pixel dành cho board, và không có mảnh giao diện nào của trình duyệt
         lọt vào ảnh chụp màn hình hay bản đóng gói APK. */
      #stage {
        flex: 1; width: 100%; min-width: 0; min-height: 0; position: relative;
        touch-action: none;   /* mọi cử chỉ trên board là của game, không phải của trình duyệt */
      }
      #stage canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
